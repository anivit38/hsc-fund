# Render Blueprint for the HSC Endowment API. In the Render dashboard: New →
# Blueprint → point at this repo, and Render reads this file automatically.
# See DEPLOY.md for the full walkthrough, including creating the free Neon
# Postgres database that DATABASE_URL points at (Render's own disk is
# ephemeral — it resets on every redeploy and every idle-sleep wake-up, so a
# real database is required for the data to actually stick).
services:
  - type: web
    name: hsc-fund-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LIVE_MARKET
        value: "true"
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random secret for you
      - key: CORS_ORIGIN
        value: "" # fill in with your Firebase Hosting URL(s), comma-separated, after deploying the frontend
      - key: DATABASE_URL
        sync: false # paste your Neon (or other Postgres) connection string here manually — see DEPLOY.md
